name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then echo 'Project ZIP not found'; exit 1; fi
          mkdir project
          unzip -q "$ZIP" -d project
          WRAPPER=$(find project -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then echo 'gradlew not found in ZIP'; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Dost-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
