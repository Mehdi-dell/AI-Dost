name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then echo 'No project ZIP found'; exit 1; fi
          mkdir project
          unzip -q "$ZIP" -d project
          find project -name gradlew -type f -exec dirname {} \; > /tmp/gradle-dir
          if [ ! -s /tmp/gradle-dir ]; then echo 'gradlew not found in ZIP'; exit 1; fi
          echo "PROJECT_DIR=$(head -n 1 /tmp/gradle-dir)" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Dost-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
